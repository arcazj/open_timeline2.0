name: Preview Release

on:
  push:
    tags: ['v*-preview.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLIC_RELEASE_APPROVED == 'true'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    environment: preview-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      - name: Package the validated preview
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/package-preview.py --tag "$TAG"
      - name: Publish a prerelease, never a stable latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG" artifacts/releases/"$TAG"/*
          --verify-tag --prerelease --latest=false
          --title "OpenBEXI Timeline $TAG"
          --notes-file "docs/releases/$TAG.md"
