name: Candidate Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implemented-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.13
          uv sync --locked --python ${{ matrix.python }}
          npm ci --ignore-scripts
      - name: Install Linux test browsers
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium firefox
      - name: Install Windows test browsers
        if: runner.os == 'Windows'
        run: npx playwright install chromium firefox
      - name: Check repository publication boundaries
        run: npm run check:repo
      - name: Verify unchanged candidate
        run: uv run --locked python scripts/verify-candidate.py --matrix --output artifacts/verification/ci
      - name: Preserve evidence, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.os }}-python${{ matrix.python }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/verification/ci
            artifacts/browser
            dist/build-manifest.json

  candidate-checks:
    name: Candidate checks
    if: always()
    needs: implemented-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every matrix entry to succeed
        env:
          RESULT: ${{ needs.implemented-checks.result }}
        run: test "$RESULT" = success
