[project]
name = "openbexi-timeline"
version = "0.1.0"
description = "Single-writer JSON timeline service"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "portalocker>=3,<5",
  "fonttools[woff]>=4,<5",
  "jsonschema>=4,<5",
  "jsonschema-rs==0.56.0",
  "jsonpatch==1.33",
  "rfc8785>=0.1,<1",
  "tzdata>=2025.2,<2027",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests/server"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
