version: 1
server:
  host: 127.0.0.1
  port: 8771
  local_browser: true
  state_root: ../var/default-test
legacy:
  root: ../../openbexi_timeline
  allow_roots: [../../openbexi_timeline/tests/data/SOURCES1, ../../openbexi_timeline/tests/data/SOURCES2]
  model: tests/models/regular_timeline.json
  timezone: UTC
  dialect: legacy-json
data_sources:
  - namespace: SOURCE1
    type: json_file
    enable: true
    data_path: tests/data/
    data_model: tests/data/SOURCES1/yyyy/mm/dd
    render: {color: '#404040', textColor: '#ffffff', dateColor: '#ffffff', alternateColor: '#e6e6e6'}
  - namespace: SOURCE2
    type: json_file
    enable: true
    data_path: tests/data/
    data_model: tests/data/SOURCES2/yyyy/mm/dd
    render: {color: '#D3D3D3', textColor: '#000000', dateColor: '#000000', alternateColor: '#e6e6e6'}
